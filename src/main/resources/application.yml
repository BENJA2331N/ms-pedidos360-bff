server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

clients:
  rabbit-admin-url: ${RABBIT_ADMIN_URL:http://localhost:8083}

# Orígenes permitidos por CORS (separados por coma). En producción: dominio del front desplegado.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}

spring:
  application:
    name: ms-pedidos360-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/c8d0fa9a-8d78-47b0-b443-f5419b74a5a8/v2.0}
          audiences: ${JWT_AUDIENCE:api://5805f927-e607-48f6-bcdb-c97e93a8f6dd}
          jwk-set-uri: ${JWT_JWK_SET_URI:}

orders:
  service:
    url: ${ORDERS_SERVICE_URL:http://localhost:8082}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}

logging:
  level:
    root: INFO
    com.pedidos360.bff: DEBUG
    org.springframework.security: DEBUG
